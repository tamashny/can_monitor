# Dashboard layout
#
# layout.columns / layout.rows:
#   number — share of the free space (fr), string — CSS size as is ("auto", "48px")
#
# cells.<area>:
#   widget — what is drawn inside (see CELL_RENDERERS in app/frontend/cells.py)
#   title  — label in the top border of the box
#   color  — border colour, a name from BOX_COLORS in app/frontend/colors.py
#   number — optional, superscript number before the title (default: order in this list)

layout:

  columns:
    - 2
    - 2.6
    - 2
    - 2
    - 2

  rows:
    - auto
    - auto
    - auto
    - 1

  areas:

    - [A, C, D, E, F]
    - [B, C, D, E, F]
    - [G, G, H, H, H]
    - [J, J, I, I, I]


cells:

  A:
    widget: can_status
    title: "can"
    color: net

  B:
    widget: ec_status
    title: "ec"
    color: cpu

  C:
    widget: systems_states
    title: "systems"
    color: proc

  D:
    widget: soc
    title: "storage"
    color: mem

  E:
    widget: v_i_t
    title: "vit"
    color: mem

  F:
    widget: converter
    title: "converter"
    color: net

  G:
    widget: contactors
    title: "contactors"
    color: cpu

  H:
    widget: cooling
    title: "cooling"
    color: cpu

  I:
    widget: cells_map
    title: "cells"
    color: proc

  J:
    widget: event_log
    title: "log"
    color: gray
    number: 0
