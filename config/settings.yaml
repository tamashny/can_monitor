# Settings of the CAN monitor.
# Changes take effect after the dashboard is restarted.


# =================================================
# CAN ADAPTERS (SLCAN on serial ports), one per bus
# =================================================

can:
  interface: slcan          # python-can interface
  port: COM3                # adapter of the main bus, CAN1 (Linux: /dev/ttyACM0)
  reserve_port: COM4        # adapter of the reserve bus, CAN2
  bitrate: 250000           # CAN bus speed of both buses, bit/s (bus 1 of the CAN map)
  serial_baudrate: 115200   # speed of the serial link to the adapter
  reconnect_interval: 3     # s between attempts to open the port
  invalid_limit: 3          # invalid frames in a row (DLC, CRC, CNT) that drop the link
  restore_count: 3          # valid frames in a row, CNT + 1, that restore it (document 03, REQ-1-8)
  map_file: ../ESMS CAN map/map/esd.yaml   # CAN map, relative to the project folder


# =================================================
# DASHBOARD
# =================================================

dashboard:
  port: 8080                # web page: http://localhost:8080
  refresh_interval: 0.5     # s, how often the boxes redraw changed values
  meter_segments: 12        # blocks in a meter bar


# =================================================
# EVENT LOG
# =================================================

event_log:
  size: 500                 # entries kept in memory and shown
  watch_interval: 0.5       # s, how often parameters are checked for changes


# =================================================
# LINK TIMEOUTS, ms
# A device is "lost" when no frame came from it for longer
# =================================================

link_timeouts:               # timeout_ms of the status frame in the CAN map
  bune: 300                 # БУНЭ, heartbeat every 100 ms on bus 1 (its status is on bus 2)
  puer: 300                 # ПУЭР, every 100 ms
  imd: 300                  # СКИ, every 100 ms
  bem: 300                  # БВИ, every 100 ms
  bup: 150                  # БУП, every 50 ms
  cc: 150                   # КК, every 50 ms
  bust_a: 300               # БУСТ-А, every 100 ms
  bust_b: 300               # БУСТ-Б, every 100 ms
  plod: 300                 # ПЛОД, every 100 ms


# =================================================
# THRESHOLDS
# Meters show min..max; colours change at the limits
# =================================================

soc:                        # %
  min: 0
  max: 100
  red_max: 20               # below — red
  yellow_max: 60            # below — yellow, above — green

soh:                        # %
  min: 60
  max: 100
  red_max: 75
  yellow_max: 85

voltage:                    # V, storage
  min: 500
  max: 1000
  red_low: 600              # below — red
  yellow: 700               # below — yellow
  green_max: 1000           # up to — green, above — red

current:                    # A
  min: 0
  max: 1000
  green_max: 700            # up to — green
  yellow_max: 900           # up to — yellow, above — red

temperature:                # °C, the colour changes smoothly between the points
  min: -40                  # storage scale: blue
  max: 80                   # red, on both scales (КК alarm threshold)
  cells_min: -20            # cells scale: blue (КК alarm threshold)
  cyan: 0
  lime: 10
  green: 30
  yellow: 60                # КК warning threshold


# =================================================
# CELLS MAP
# =================================================

cells:
  voltage_count: 68         # array_cc_v, groups of 10 cells
  temperature_count: 102    # array_cc_t, sensors
  voltage_columns: 17       # tiles in a row
  temperature_columns: 17

  # Group voltage, V — default thresholds of КК (objects 0x2020..0x2023)
  voltage_red_low: 8        # below — red
  voltage_yellow: 10        # below — yellow
  voltage_green_max: 16     # up to — green
  voltage_yellow_max: 18    # up to — yellow, above — red
